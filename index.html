<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegrowthInc Wiki & Database</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #121212; color: #e0e0e0; }
        h1 { color: #4CAF50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; }
        th, td { border: 1px solid #333; padding: 12px; text-align: left; }
        th { background-color: #2e2e2e; color: #4CAF50; }
        .error { color: #ff6b6b; font-weight: bold; }
    </style>
</head>
<body>

    <h1>RegrowthInc Game Database</h1>
    <p>The table below is loaded live from your Excel/CSV file:</p>

    <table id="dataTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="2">Loading data...</td></tr>
        </tbody>
    </table>

    <script>
        async function loadTable() {
            try {
                let response = await fetch('Example.csv').catch(() => null);
                if (!response || !response.ok) {
                    response = await fetch('example.csv');
                }
                
                const csvText = await response.text();
                
                if (csvText.trim().startsWith('<!DOCTYPE html>') || csvText.includes('File not found')) {
                    throw new Error("CSV file was not found!");
                }
                
                const rows = csvText.split(/\r?\n/);
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = ""; 

                const separator = csvText.includes(';') ? ';' : ',';

                rows.forEach((row, index) => {
                    if (index === 0 || !row.trim()) return; 
                    
                    const cols = row.split(separator);
                    if (cols.length >= 2) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${cols[0].trim()}</td><td>${cols[1].trim()}</td>`;
                        tbody.appendChild(tr);
                    }
                });

                if (tbody.innerHTML === "") {
                    tbody.innerHTML = `<tr><td colspan="2" class="error">File loaded, but no valid data rows were found.</td></tr>`;
                }
            } catch (error) {
                console.error("Error:", error);
                const tbody = document.querySelector('#dataTable tbody');
                tbody.innerHTML = `<tr><td colspan="2" class="error">Failed to load data! Please check your CSV file.</td></tr>`;
            }
        }

        loadTable();
    </script>

</body>
</html>
